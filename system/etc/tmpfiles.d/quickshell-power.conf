# systemd-tmpfiles rule: lets wheel members set the battery charge limit and the
# platform profile from the quickshell battery plugin (root-only by default).
# Installed by `./install.py system install`.
z /sys/class/power_supply/BAT0/charge_control_end_threshold 0664 root wheel -
z /sys/firmware/acpi/platform_profile                        0664 root wheel -
