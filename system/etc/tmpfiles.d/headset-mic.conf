# systemd-tmpfiles rule: the headset mic on the ALC294 jack (ASUS TUF Dash F15).
# The firmware leaves pin 0x19 unconnected (0x411111f0); set it to a left 3.5 mm
# mic jack with presence detect and re-probe the codec, as hdajackretask would.
# Runs at boot before PipeWire holds the card. Installed by `./install.py system install`.
w /sys/class/sound/hwC0D0/user_pin_configs - - - - 0x19 0x03a11020
w /sys/class/sound/hwC0D0/reconfig         - - - - 1
