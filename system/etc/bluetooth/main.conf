# bluetooth — BlueZ daemon. AirPods: the adapter stays BR/EDR (their audio never
# uses LE), and the defaults hold the rest: HFP for the mic, A2DP for music, and
# a trusted device connects by itself when it is near (`trust` in bluetoothctl).
# Only keys BlueZ 5.87 knows: it logs the others as errors and ignores them.
# Installed by `./install.py system install`; applies after `systemctl restart bluetooth`.
[General]
ControllerMode=bredr
DiscoverableTimeout=0
