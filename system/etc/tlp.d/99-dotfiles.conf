# TLP settings (see docs/POWER_MANAGEMENT.md). Installed by
# `./install.py system install`; TLP reads /etc/tlp.d/*.conf before
# /etc/tlp.conf, so keep tlp.conf at the package defaults for these to apply.
#
# Charge thresholds stay unset: the quickshell battery plugin owns
# charge_control_end_threshold.

CPU_SCALING_GOVERNOR_ON_AC=powersave
CPU_SCALING_GOVERNOR_ON_BAT=powersave

CPU_ENERGY_PERF_POLICY_ON_AC=balance_power
CPU_ENERGY_PERF_POLICY_ON_BAT=power

CPU_MAX_PERF_ON_AC=80
CPU_MAX_PERF_ON_BAT=30

NMI_WATCHDOG=0

PLATFORM_PROFILE_ON_AC=balanced
PLATFORM_PROFILE_ON_BAT=low-power

WIFI_PWR_ON_BAT=on
WIFI_PWR_ON_AC=off
