# GENERAL SETTINGS
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

set -g mouse              on
set -g base-index         1
set -g renumber-windows   on
set -g history-limit      10000
set -g detach-on-destroy  off

# KEYBINDINGS
bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded"

# Managment
bind s new-session
bind w new-window -c "#{pane_current_path}"
bind t choose-tree -s

# Termination
bind S confirm-before -p "Kill session #S? (y/n)" kill-session
bind W confirm-before -p "Kill window #W? (y/n)" kill-window
bind P confirm-before -p "Kill pane #P? (y/n)" kill-pane

# Splitting
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resizing
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Switching
bind -r H previous-window
bind -r L next-window

# Navigation
bind-key -n M-1 select-window -t 1
bind-key -n M-2 select-window -t 2
bind-key -n M-3 select-window -t 3
bind-key -n M-4 select-window -t 4
bind-key -n M-5 select-window -t 5
bind-key -n M-6 select-window -t 6
bind-key -n M-7 select-window -t 7
bind-key -n M-8 select-window -t 8
bind-key -n M-9 select-window -t 9

# APPEARANCE
set -g status 2
set -g status-interval 1
set -g status-position top
set -g status-justify left
set -g status-style "bg=default,fg=colour7"

# Status left
set -g status-left-length 40
set -g status-left "#[fg=#282828,bg=colour15,bold] #S #[fg=colour7,bg=#504945]#[fg=colour7,bg=colour=#504945] #I:#P #[fg=default,bg=default] "

# Status right
set -g status-right-length 80
set -g status-right "#[fg=colour7,bg=#504945] %H:%M #[fg=#282828,bg=colour15,bold] %d-%b "

# Status bottom (second line)
set -g status-format[1] "#[bg=default] "

# Windows
setw -g window-status-format "#[fg=colour15,bg=#504945,bold] #I:#W "
setw -g window-status-current-format "#[fg=#282828,bg=colour2,bold] #I:#W "
setw -g window-status-separator ""
