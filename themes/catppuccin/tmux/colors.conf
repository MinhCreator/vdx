# tmux colours — gruvbox-material (themes/gruvbox/README.md)
set -g status-style "bg=default,fg=#cdd6f4"
set -g pane-border-style        "fg=#45475a"
set -g pane-active-border-style "fg=#6c7086"
set -g status-left "#[fg=#1e1e2e,bg=#cdd6f4,bold] #S #[fg=#bac2de,bg=#313244,nobold] #I:#P #[fg=default,bg=default] "
set -g status-right "#[fg=#bac2de,bg=#313244] %H:%M #[fg=#1e1e2e,bg=#cdd6f4,bold] %d-%b "
setw -g window-status-format "#[fg=#7f849c,bg=#313244] #I:#W "
setw -g window-status-current-format "#[fg=#cdd6f4,bg=#45475a,bold] #I:#W "
