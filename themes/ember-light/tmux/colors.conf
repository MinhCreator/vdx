# tmux colours — gruvbox-material (themes/gruvbox/README.md)
set -g status-style "bg=default,fg=#3a2a24"
set -g pane-border-style        "fg=#dccabd"
set -g pane-active-border-style "fg=#a8958a"
set -g status-left "#[fg=#faf3ee,bg=#3a2a24,bold] #S #[fg=#5c4a42,bg=#e9dcd2,nobold] #I:#P #[fg=default,bg=default] "
set -g status-right "#[fg=#5c4a42,bg=#e9dcd2] %H:%M #[fg=#faf3ee,bg=#3a2a24,bold] %d-%b "
setw -g window-status-format "#[fg=#6e5a4f,bg=#e9dcd2] #I:#W "
setw -g window-status-current-format "#[fg=#3a2a24,bg=#dccabd,bold] #I:#W "
