# tmux colours — gruvbox-material (themes/gruvbox/README.md)
set -g status-style "bg=default,fg=#e0def4"
set -g pane-border-style        "fg=#403d52"
set -g pane-active-border-style "fg=#6e6a86"
set -g status-left "#[fg=#191724,bg=#e0def4,bold] #S #[fg=#c1bed9,bg=#26233a,nobold] #I:#P #[fg=default,bg=default] "
set -g status-right "#[fg=#c1bed9,bg=#26233a] %H:%M #[fg=#191724,bg=#e0def4,bold] %d-%b "
setw -g window-status-format "#[fg=#908caa,bg=#26233a] #I:#W "
setw -g window-status-current-format "#[fg=#e0def4,bg=#403d52,bold] #I:#W "
