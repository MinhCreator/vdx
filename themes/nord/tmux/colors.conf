# tmux colours — gruvbox-material (themes/gruvbox/README.md)
set -g status-style "bg=default,fg=#d8dee9"
set -g pane-border-style        "fg=#4c566a"
set -g pane-active-border-style "fg=#616e88"
set -g status-left "#[fg=#2e3440,bg=#d8dee9,bold] #S #[fg=#b9c0cd,bg=#434c5e,nobold] #I:#P #[fg=default,bg=default] "
set -g status-right "#[fg=#b9c0cd,bg=#434c5e] %H:%M #[fg=#2e3440,bg=#d8dee9,bold] %d-%b "
setw -g window-status-format "#[fg=#7b88a1,bg=#434c5e] #I:#W "
setw -g window-status-current-format "#[fg=#d8dee9,bg=#4c566a,bold] #I:#W "
