# tmux colours — gruvbox-material (themes/gruvbox/README.md)
set -g status-style "bg=default,fg=#545464"
set -g pane-border-style        "fg=#d5cea3"
set -g pane-active-border-style "fg=#a09c86"
set -g status-left "#[fg=#f2ecbc,bg=#545464,bold] #S #[fg=#6a6a7a,bg=#dcd5ac,nobold] #I:#P #[fg=default,bg=default] "
set -g status-right "#[fg=#6a6a7a,bg=#dcd5ac] %H:%M #[fg=#f2ecbc,bg=#545464,bold] %d-%b "
setw -g window-status-format "#[fg=#6b685a,bg=#dcd5ac] #I:#W "
setw -g window-status-current-format "#[fg=#545464,bg=#d5cea3,bold] #I:#W "
