# tmux colours — gruvbox-material (themes/gruvbox/README.md)
set -g status-style "bg=default,fg=#3c3836"
set -g pane-border-style        "fg=#d5c4a1"
set -g pane-active-border-style "fg=#a89984"
set -g status-left "#[fg=#fbf1c7,bg=#3c3836,bold] #S #[fg=#504945,bg=#ebdbb2,nobold] #I:#P #[fg=default,bg=default] "
set -g status-right "#[fg=#504945,bg=#ebdbb2] %H:%M #[fg=#fbf1c7,bg=#3c3836,bold] %d-%b "
setw -g window-status-format "#[fg=#6f6259,bg=#ebdbb2] #I:#W "
setw -g window-status-current-format "#[fg=#3c3836,bg=#d5c4a1,bold] #I:#W "
