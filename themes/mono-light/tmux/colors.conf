# tmux colours — gruvbox-material (themes/gruvbox/README.md)
set -g status-style "bg=default,fg=#111111"
set -g pane-border-style        "fg=#dadada"
set -g pane-active-border-style "fg=#9e9e9e"
set -g status-left "#[fg=#ffffff,bg=#111111,bold] #S #[fg=#3a3a3a,bg=#e8e8e8,nobold] #I:#P #[fg=default,bg=default] "
set -g status-right "#[fg=#3a3a3a,bg=#e8e8e8] %H:%M #[fg=#ffffff,bg=#111111,bold] %d-%b "
setw -g window-status-format "#[fg=#5f5f5f,bg=#e8e8e8] #I:#W "
setw -g window-status-current-format "#[fg=#111111,bg=#dadada,bold] #I:#W "
