# tmux colours — gruvbox-material (themes/gruvbox/README.md)
set -g status-style "bg=default,fg=#1f1f1f"
set -g pane-border-style        "fg=#cfcfde"
set -g pane-active-border-style "fg=#9e9aa8"
set -g status-left "#[fg=#fffbeb,bg=#1f1f1f,bold] #S #[fg=#4a4a4a,bg=#e6e2cf,nobold] #I:#P #[fg=default,bg=default] "
set -g status-right "#[fg=#4a4a4a,bg=#e6e2cf] %H:%M #[fg=#fffbeb,bg=#1f1f1f,bold] %d-%b "
setw -g window-status-format "#[fg=#635d97,bg=#e6e2cf] #I:#W "
setw -g window-status-current-format "#[fg=#1f1f1f,bg=#cfcfde,bold] #I:#W "
