# tmux colours — gruvbox-material (themes/gruvbox/README.md)
set -g status-style "bg=default,fg=#4c4f69"
set -g pane-border-style        "fg=#ccd0da"
set -g pane-active-border-style "fg=#9ca0b0"
set -g status-left "#[fg=#eff1f5,bg=#4c4f69,bold] #S #[fg=#5c5f77,bg=#dce0e8,nobold] #I:#P #[fg=default,bg=default] "
set -g status-right "#[fg=#5c5f77,bg=#dce0e8] %H:%M #[fg=#eff1f5,bg=#4c4f69,bold] %d-%b "
setw -g window-status-format "#[fg=#5c5f77,bg=#dce0e8] #I:#W "
setw -g window-status-current-format "#[fg=#4c4f69,bg=#ccd0da,bold] #I:#W "
