# tmux colours — gruvbox-material (themes/gruvbox/README.md)
set -g status-style "bg=default,fg=#e6e6e9"
set -g pane-border-style        "fg=#34343a"
set -g pane-active-border-style "fg=#4a4a52"
set -g status-left "#[fg=#161618,bg=#e6e6e9,bold] #S #[fg=#b4b4ba,bg=#27272b,nobold] #I:#P #[fg=default,bg=default] "
set -g status-right "#[fg=#b4b4ba,bg=#27272b] %H:%M #[fg=#161618,bg=#e6e6e9,bold] %d-%b "
setw -g window-status-format "#[fg=#84848c,bg=#27272b] #I:#W "
setw -g window-status-current-format "#[fg=#e6e6e9,bg=#34343a,bold] #I:#W "
