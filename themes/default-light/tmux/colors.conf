# tmux colours — gruvbox-material (themes/gruvbox/README.md)
set -g status-style "bg=default,fg=#1c1c1f"
set -g pane-border-style        "fg=#d6d6db"
set -g pane-active-border-style "fg=#a0a0a8"
set -g status-left "#[fg=#f7f7f8,bg=#1c1c1f,bold] #S #[fg=#46464d,bg=#e4e4e7,nobold] #I:#P #[fg=default,bg=default] "
set -g status-right "#[fg=#46464d,bg=#e4e4e7] %H:%M #[fg=#f7f7f8,bg=#1c1c1f,bold] %d-%b "
setw -g window-status-format "#[fg=#62626a,bg=#e4e4e7] #I:#W "
setw -g window-status-current-format "#[fg=#1c1c1f,bg=#d6d6db,bold] #I:#W "
