# tmux colours — gruvbox-material (themes/gruvbox/README.md)
set -g status-style "bg=default,fg=#5c6a72"
set -g pane-border-style        "fg=#e6e2cc"
set -g pane-active-border-style "fg=#a6b0a0"
set -g status-left "#[fg=#fdf6e3,bg=#5c6a72,bold] #S #[fg=#708089,bg=#efebd4,nobold] #I:#P #[fg=default,bg=default] "
set -g status-right "#[fg=#708089,bg=#efebd4] %H:%M #[fg=#fdf6e3,bg=#5c6a72,bold] %d-%b "
setw -g window-status-format "#[fg=#66756d,bg=#efebd4] #I:#W "
setw -g window-status-current-format "#[fg=#5c6a72,bg=#e6e2cc,bold] #I:#W "
