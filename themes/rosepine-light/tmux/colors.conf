# tmux colours — gruvbox-material (themes/gruvbox/README.md)
set -g status-style "bg=default,fg=#575279"
set -g pane-border-style        "fg=#cecacd"
set -g pane-active-border-style "fg=#9893a5"
set -g status-left "#[fg=#faf4ed,bg=#575279,bold] #S #[fg=#797593,bg=#dfdad9,nobold] #I:#P #[fg=default,bg=default] "
set -g status-right "#[fg=#797593,bg=#dfdad9] %H:%M #[fg=#faf4ed,bg=#575279,bold] %d-%b "
setw -g window-status-format "#[fg=#68637f,bg=#dfdad9] #I:#W "
setw -g window-status-current-format "#[fg=#575279,bg=#cecacd,bold] #I:#W "
