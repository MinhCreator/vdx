# tmux colours — gruvbox-material (themes/gruvbox/README.md)
set -g status-style "bg=default,fg=#3a3426"
set -g pane-border-style        "fg=#d6cbb0"
set -g pane-active-border-style "fg=#a39a85"
set -g status-left "#[fg=#f6f1e4,bg=#3a3426,bold] #S #[fg=#5a5240,bg=#e3dbc6,nobold] #I:#P #[fg=default,bg=default] "
set -g status-right "#[fg=#5a5240,bg=#e3dbc6] %H:%M #[fg=#f6f1e4,bg=#3a3426,bold] %d-%b "
setw -g window-status-format "#[fg=#6b6250,bg=#e3dbc6] #I:#W "
setw -g window-status-current-format "#[fg=#3a3426,bg=#d6cbb0,bold] #I:#W "
