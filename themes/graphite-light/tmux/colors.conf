# tmux colours — gruvbox-material (themes/gruvbox/README.md)
set -g status-style "bg=default,fg=#1c1c1c"
set -g pane-border-style        "fg=#d4d4d4"
set -g pane-active-border-style "fg=#9a9a9a"
set -g status-left "#[fg=#f5f5f5,bg=#1c1c1c,bold] #S #[fg=#444444,bg=#e2e2e2,nobold] #I:#P #[fg=default,bg=default] "
set -g status-right "#[fg=#444444,bg=#e2e2e2] %H:%M #[fg=#f5f5f5,bg=#1c1c1c,bold] %d-%b "
setw -g window-status-format "#[fg=#5f5f5f,bg=#e2e2e2] #I:#W "
setw -g window-status-current-format "#[fg=#1c1c1c,bg=#d4d4d4,bold] #I:#W "
