# tmux colours — gruvbox-material (themes/gruvbox/README.md)
set -g status-style "bg=default,fg=#e4e4e4"
set -g pane-border-style        "fg=#2c2c2c"
set -g pane-active-border-style "fg=#6e6e6e"
set -g status-left "#[fg=#0e0e0e,bg=#e4e4e4,bold] #S #[fg=#b8b8b8,bg=#1f1f1f,nobold] #I:#P #[fg=default,bg=default] "
set -g status-right "#[fg=#b8b8b8,bg=#1f1f1f] %H:%M #[fg=#0e0e0e,bg=#e4e4e4,bold] %d-%b "
setw -g window-status-format "#[fg=#8a8a8a,bg=#1f1f1f] #I:#W "
setw -g window-status-current-format "#[fg=#e4e4e4,bg=#2c2c2c,bold] #I:#W "
