# tmux colours — gruvbox-material (themes/gruvbox/README.md)
set -g status-style "bg=default,fg=#ececee"
set -g pane-border-style        "fg=#222226"
set -g pane-active-border-style "fg=#3a3a40"
set -g status-left "#[fg=#0e0e10,bg=#ececee,bold] #S #[fg=#a3a3ab,bg=#19191c,nobold] #I:#P #[fg=default,bg=default] "
set -g status-right "#[fg=#a3a3ab,bg=#19191c] %H:%M #[fg=#0e0e10,bg=#ececee,bold] %d-%b "
setw -g window-status-format "#[fg=#8b8b93,bg=#19191c] #I:#W "
setw -g window-status-current-format "#[fg=#ececee,bg=#222226,bold] #I:#W "
