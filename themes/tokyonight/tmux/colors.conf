# tmux colours — gruvbox-material (themes/gruvbox/README.md)
set -g status-style "bg=default,fg=#c0caf5"
set -g pane-border-style        "fg=#2f344e"
set -g pane-active-border-style "fg=#565f89"
set -g status-left "#[fg=#1a1b26,bg=#c0caf5,bold] #S #[fg=#a9b1d6,bg=#24283b,nobold] #I:#P #[fg=default,bg=default] "
set -g status-right "#[fg=#a9b1d6,bg=#24283b] %H:%M #[fg=#1a1b26,bg=#c0caf5,bold] %d-%b "
setw -g window-status-format "#[fg=#737aa2,bg=#24283b] #I:#W "
setw -g window-status-current-format "#[fg=#c0caf5,bg=#2f344e,bold] #I:#W "
