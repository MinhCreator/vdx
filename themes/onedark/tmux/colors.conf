# tmux colours — gruvbox-material (themes/gruvbox/README.md)
set -g status-style "bg=default,fg=#abb2bf"
set -g pane-border-style        "fg=#3e4451"
set -g pane-active-border-style "fg=#5c6370"
set -g status-left "#[fg=#282c34,bg=#abb2bf,bold] #S #[fg=#9da5b4,bg=#353b45,nobold] #I:#P #[fg=default,bg=default] "
set -g status-right "#[fg=#9da5b4,bg=#353b45] %H:%M #[fg=#282c34,bg=#abb2bf,bold] %d-%b "
setw -g window-status-format "#[fg=#7f848e,bg=#353b45] #I:#W "
setw -g window-status-current-format "#[fg=#abb2bf,bg=#3e4451,bold] #I:#W "
