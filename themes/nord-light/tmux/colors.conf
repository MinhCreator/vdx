# tmux colours — gruvbox-material (themes/gruvbox/README.md)
set -g status-style "bg=default,fg=#2e3440"
set -g pane-border-style        "fg=#c8d0de"
set -g pane-active-border-style "fg=#9aa5b8"
set -g status-left "#[fg=#eceff4,bg=#2e3440,bold] #S #[fg=#3b4252,bg=#d8dee9,nobold] #I:#P #[fg=default,bg=default] "
set -g status-right "#[fg=#3b4252,bg=#d8dee9] %H:%M #[fg=#eceff4,bg=#2e3440,bold] %d-%b "
setw -g window-status-format "#[fg=#4c566a,bg=#d8dee9] #I:#W "
setw -g window-status-current-format "#[fg=#2e3440,bg=#c8d0de,bold] #I:#W "
