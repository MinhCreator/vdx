# tmux colours — gruvbox-material (themes/gruvbox/README.md)
set -g status-style "bg=default,fg=#dcd7ba"
set -g pane-border-style        "fg=#54546d"
set -g pane-active-border-style "fg=#727169"
set -g status-left "#[fg=#1f1f28,bg=#dcd7ba,bold] #S #[fg=#c8c093,bg=#363646,nobold] #I:#P #[fg=default,bg=default] "
set -g status-right "#[fg=#c8c093,bg=#363646] %H:%M #[fg=#1f1f28,bg=#dcd7ba,bold] %d-%b "
setw -g window-status-format "#[fg=#938aa9,bg=#363646] #I:#W "
setw -g window-status-current-format "#[fg=#dcd7ba,bg=#54546d,bold] #I:#W "
