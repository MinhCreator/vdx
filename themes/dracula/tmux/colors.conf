# tmux colours — gruvbox-material (themes/gruvbox/README.md)
set -g status-style "bg=default,fg=#f8f8f2"
set -g pane-border-style        "fg=#44475a"
set -g pane-active-border-style "fg=#6272a4"
set -g status-left "#[fg=#282a36,bg=#f8f8f2,bold] #S #[fg=#c9c9c4,bg=#383a4a,nobold] #I:#P #[fg=default,bg=default] "
set -g status-right "#[fg=#c9c9c4,bg=#383a4a] %H:%M #[fg=#282a36,bg=#f8f8f2,bold] %d-%b "
setw -g window-status-format "#[fg=#7a86b0,bg=#383a4a] #I:#W "
setw -g window-status-current-format "#[fg=#f8f8f2,bg=#44475a,bold] #I:#W "
