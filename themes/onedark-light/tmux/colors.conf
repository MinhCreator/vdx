# tmux colours — gruvbox-material (themes/gruvbox/README.md)
set -g status-style "bg=default,fg=#383a42"
set -g pane-border-style        "fg=#dbdbdc"
set -g pane-active-border-style "fg=#a0a1a7"
set -g status-left "#[fg=#fafafa,bg=#383a42,bold] #S #[fg=#4f525e,bg=#e5e5e6,nobold] #I:#P #[fg=default,bg=default] "
set -g status-right "#[fg=#4f525e,bg=#e5e5e6] %H:%M #[fg=#fafafa,bg=#383a42,bold] %d-%b "
setw -g window-status-format "#[fg=#62656f,bg=#e5e5e6] #I:#W "
setw -g window-status-current-format "#[fg=#383a42,bg=#dbdbdc,bold] #I:#W "
