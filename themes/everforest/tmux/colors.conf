# tmux colours — gruvbox-material (themes/gruvbox/README.md)
set -g status-style "bg=default,fg=#d3c6aa"
set -g pane-border-style        "fg=#475258"
set -g pane-active-border-style "fg=#7a8478"
set -g status-left "#[fg=#2d353b,bg=#d3c6aa,bold] #S #[fg=#bdb59c,bg=#3d484d,nobold] #I:#P #[fg=default,bg=default] "
set -g status-right "#[fg=#bdb59c,bg=#3d484d] %H:%M #[fg=#2d353b,bg=#d3c6aa,bold] %d-%b "
setw -g window-status-format "#[fg=#859289,bg=#3d484d] #I:#W "
setw -g window-status-current-format "#[fg=#d3c6aa,bg=#475258,bold] #I:#W "
