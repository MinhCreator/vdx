# tmux colours — gruvbox-material (themes/gruvbox/README.md)
set -g status-style "bg=default,fg=#eadbd0"
set -g pane-border-style        "fg=#42322c"
set -g pane-active-border-style "fg=#6e5a51"
set -g status-left "#[fg=#231b19,bg=#eadbd0,bold] #S #[fg=#bfae9f,bg=#352925,nobold] #I:#P #[fg=default,bg=default] "
set -g status-right "#[fg=#bfae9f,bg=#352925] %H:%M #[fg=#231b19,bg=#eadbd0,bold] %d-%b "
setw -g window-status-format "#[fg=#94827a,bg=#352925] #I:#W "
setw -g window-status-current-format "#[fg=#eadbd0,bg=#42322c,bold] #I:#W "
