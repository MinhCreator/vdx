# tmux colours — gruvbox-material (themes/gruvbox/README.md)
set -g status-style "bg=default,fg=#e5d7b2"
set -g pane-border-style        "fg=#322f26"
set -g pane-active-border-style "fg=#5a5a5a"
set -g status-left "#[fg=#141414,bg=#e5d7b2,bold] #S #[fg=#b8ac8e,bg=#232323,nobold] #I:#P #[fg=default,bg=default] "
set -g status-right "#[fg=#b8ac8e,bg=#232323] %H:%M #[fg=#141414,bg=#e5d7b2,bold] %d-%b "
setw -g window-status-format "#[fg=#8a8270,bg=#232323] #I:#W "
setw -g window-status-current-format "#[fg=#e5d7b2,bg=#322f26,bold] #I:#W "
