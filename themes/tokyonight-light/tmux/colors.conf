# tmux colours — gruvbox-material (themes/gruvbox/README.md)
set -g status-style "bg=default,fg=#3760bf"
set -g pane-border-style        "fg=#b6bfe2"
set -g pane-active-border-style "fg=#8990b3"
set -g status-left "#[fg=#e1e2e7,bg=#3760bf,bold] #S #[fg=#6172b0,bg=#c4c8da,nobold] #I:#P #[fg=default,bg=default] "
set -g status-right "#[fg=#6172b0,bg=#c4c8da] %H:%M #[fg=#e1e2e7,bg=#3760bf,bold] %d-%b "
setw -g window-status-format "#[fg=#4f5a8a,bg=#c4c8da] #I:#W "
setw -g window-status-current-format "#[fg=#3760bf,bg=#b6bfe2,bold] #I:#W "
