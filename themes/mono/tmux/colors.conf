# tmux colours — gruvbox-material (themes/gruvbox/README.md)
set -g status-style "bg=default,fg=#d6d6d6"
set -g pane-border-style        "fg=#262626"
set -g pane-active-border-style "fg=#4d4d4d"
set -g status-left "#[fg=#0a0a0a,bg=#d6d6d6,bold] #S #[fg=#a3a3a3,bg=#191919,nobold] #I:#P #[fg=default,bg=default] "
set -g status-right "#[fg=#a3a3a3,bg=#191919] %H:%M #[fg=#0a0a0a,bg=#d6d6d6,bold] %d-%b "
setw -g window-status-format "#[fg=#767676,bg=#191919] #I:#W "
setw -g window-status-current-format "#[fg=#d6d6d6,bg=#262626,bold] #I:#W "
