# tmux colours — gruvbox-material (themes/gruvbox/README.md)
set -g status-style "bg=default,fg=#d4be98"
set -g pane-border-style        "fg=#45403d"
set -g pane-active-border-style "fg=#7c6f64"
set -g status-left "#[fg=#202020,bg=#d4be98,bold] #S #[fg=#bdae93,bg=#3c3836,nobold] #I:#P #[fg=default,bg=default] "
set -g status-right "#[fg=#bdae93,bg=#3c3836] %H:%M #[fg=#202020,bg=#d4be98,bold] %d-%b "
setw -g window-status-format "#[fg=#928374,bg=#3c3836] #I:#W "
setw -g window-status-current-format "#[fg=#d4be98,bg=#45403d,bold] #I:#W "
