# xdg-desktop-portal — which backend serves what in the Hyprland session. The
# file chooser and the URI opener are the shell's (scripts/files_portal.py);
# the rest stays with Hyprland, then GTK.
[preferred]
default=hyprland;gtk
org.freedesktop.impl.portal.FileChooser=shellfiles
org.freedesktop.impl.portal.OpenURI=shellfiles
