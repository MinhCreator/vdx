# MPD — music daemon behind the bar's music and radio plugins
# https://mpd.readthedocs.io/en/stable/user.html

# Files & Directories
music_directory    "~/Music/yandex"
db_file            "~/.local/share/mpd/database"
log_file           "~/.local/share/mpd/log"
pid_file           "~/.local/share/mpd/pid"
state_file         "~/.local/share/mpd/state"
sticker_file       "~/.local/share/mpd/sticker.sql"

# Network Settings
bind_to_address    "~/.local/share/mpd/socket"

# Performance & Buffers
audio_buffer_size      "16384"
max_output_buffer_size "32768"

# Input Plugins
input {
    plugin "curl"
}

# Decoders: mpg123 drops some internet radio streams seconds in ("Frankenstein stream?",
# "Prepare for a changed audio format") and MPD stops the station; the next one (libmad,
# else ffmpeg) plays them, and the local mp3s too
decoder {
    plugin  "mpg123"
    enabled "no"
}

# Audio Output
audio_output {
    type  "pipewire"
    name  "PipeWire"
}

# Visualizer (FIFO)
audio_output {
    type    "fifo"
    name    "Visualizer"
    path    "/tmp/mpd.fifo"
    format  "44100:16:2"
}
