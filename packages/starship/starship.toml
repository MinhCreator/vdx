# starship — zsh prompt
# https://starship.rs/config/

add_newline    = false
format         = """
$directory$git_branch$git_status
$character
"""

[directory]
style          = "bold white"
format         = "[$path]($style) "

[git_branch]
symbol         = "* "
style          = "bold magenta"
format         = "on [$symbol$branch]($style) "

[git_status]
style          = "bold red"
format         = "([$ahead_behind]($style))"

[character]
success_symbol = "[»](bold black)"
error_symbol   = "[»](bold black)"
