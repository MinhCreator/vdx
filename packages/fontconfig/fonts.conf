<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- fontconfig — the `monospace` font of the desktop (terminal, mako)
     https://www.freedesktop.org/software/fontconfig/fontconfig-user.html -->
<fontconfig>
  <!-- the font picked in the Shell Manager (scripts/fonts.py set); first, so it wins -->
  <include ignore_missing="yes">~/.local/state/dotfiles/font.conf</include>

  <!-- the default until one is picked -->
  <alias binding="strong">
    <family>monospace</family>
    <prefer><family>JetBrainsMono Nerd Font</family></prefer>
  </alias>
</fontconfig>
