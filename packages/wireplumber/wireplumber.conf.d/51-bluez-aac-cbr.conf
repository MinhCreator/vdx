# wireplumber — AAC over A2DP in CBR. The default VBR mode 5 ignores the bitrate that
# PipeWire lowers when the radio falls behind, so packets are dropped instead (stutter).
# The sink reads codec settings from the device's props, hence a device rule.
monitor.bluez.rules = [
  {
    matches = [
      { device.name = "~bluez_card.*" }
    ]
    actions = {
      update-props = {
        bluez5.a2dp.aac.bitratemode = 0
      }
    }
  }
]
