# kitty — terminal; colours come from colors.conf of the active theme
# https://sw.kovidgoyal.net/kitty/conf/

include colors.conf

term                    xterm-kitty
shell                   zsh --login -c "tmux attach || tmux"
font_family             monospace
# the font picked in the Shell Manager by name (written by fonts.py set): a
# running kitty keeps its first idea of `monospace`, a name it reloads
globinclude             font.conf
font_size               12.0
window_padding_width    16 24
cursor_trail            3
confirm_os_window_close 0

# no remembered size: the window manager's layout sizes a new window (a
# remembered full-screen size made a scrolling column span the whole screen)
remember_window_size    no
